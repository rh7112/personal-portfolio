name: Scheduled rebuild

# Triggers a Cloudflare Pages rebuild on a schedule so SQL content changes
# show up on the site without needing a code push.

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  trigger-deploy-hook:
    runs-on: ubuntu-latest
    steps:
      - name: Call Cloudflare deploy hook
        run: curl -fsS -X POST "${{ secrets.CF_DEPLOY_HOOK_URL }}"
